<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Circle background: sky-to-cyan gradient, no purple -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>

  <!-- Stack: three overlapping screens, back to front -->
  <rect x="58" y="42" width="112" height="78" rx="9" fill="white" opacity="0.18"/>
  <rect x="51" y="56" width="112" height="78" rx="9" fill="white" opacity="0.42"/>
  <rect x="44" y="70" width="112" height="78" rx="9" fill="white" opacity="0.96"/>

  <!-- DM monogram on front screen, dark cyan so it pops on white -->
  <text
    x="100" y="120"
    font-family="Arial Black, Helvetica Neue, Impact, Arial, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#0369a1"
    text-anchor="middle"
    letter-spacing="-2">DM</text>

  <!-- Three mini screen bars below DM text (inside front screen) -->
  <rect x="56"  y="129" width="34" height="8" rx="2" fill="#0ea5e9" opacity="0.50"/>
  <rect x="94"  y="129" width="24" height="8" rx="2" fill="#0891b2" opacity="0.40"/>
  <rect x="122" y="129" width="26" height="8" rx="2" fill="#0ea5e9" opacity="0.30"/>
</svg>
